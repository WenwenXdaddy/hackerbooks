<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 黑客书架：捧着书的猫头鹰（阅读 · 智慧），镜头般的眼睛与书页上的神经网络代表 AI -->
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d4d70"/><stop offset="1" stop-color="#1a2f47"/></linearGradient></defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- body with ear tufts -->
  <path d="M170 112 L 214 160 Q 256 148 298 160 L 342 112 C 364 158 374 204 372 256 C 370 330 322 384 256 384 C 190 384 142 330 140 256 C 138 204 148 158 170 112 Z" fill="#d9b98c"/>
  <!-- wings -->
  <path d="M146 250 C 150 310 176 352 214 372 C 186 330 176 290 180 246 Z" fill="#b8925f"/>
  <path d="M366 250 C 362 310 336 352 298 372 C 326 330 336 290 332 246 Z" fill="#b8925f"/>
  <!-- facial disc -->
  <circle cx="212" cy="222" r="50" fill="#f6ead6"/><circle cx="300" cy="222" r="50" fill="#f6ead6"/>
  <!-- eyes: camera-lens irises -->
  <circle cx="212" cy="222" r="31" fill="#1c324b"/><circle cx="300" cy="222" r="31" fill="#1c324b"/>
  <circle cx="212" cy="222" r="22" fill="none" stroke="#ffc861" stroke-width="7"/><circle cx="300" cy="222" r="22" fill="none" stroke="#ffc861" stroke-width="7"/>
  <circle cx="212" cy="222" r="9" fill="#ffc861"/><circle cx="300" cy="222" r="9" fill="#ffc861"/>
  <circle cx="221" cy="212" r="5" fill="#fff8e8"/><circle cx="309" cy="212" r="5" fill="#fff8e8"/>
  <!-- beak -->
  <path d="M243 252 L 256 282 L 269 252 Q 256 244 243 252 Z" fill="#e39a3b"/>

  <!-- open book held in front -->
  <path d="M256 418 C 212 392 162 386 110 396 V 326 C 162 316 212 322 256 348 C 300 322 350 316 402 326 V 396 C 350 386 300 392 256 418 Z" fill="#fbf6ee"/>
  <path d="M256 348 V 418" stroke="#c9d6e3" stroke-width="6"/>
  <!-- left page: text; right page: a small neural network -->
  <g stroke="#9fb4c9" stroke-width="6" stroke-linecap="round" fill="none"><path d="M140 356 C 172 350 204 352 230 362"/><path d="M140 378 C 172 372 204 374 230 384"/></g>
  <g stroke="#7f9ab5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M292 364 L 322 350 L 362 360 L 344 384 L 292 364 M322 350 L 344 384"/></g>
  <g fill="#2f6ea8"><circle cx="292" cy="364" r="6.5"/><circle cx="322" cy="350" r="6.5"/><circle cx="362" cy="360" r="6.5"/><circle cx="344" cy="384" r="6.5"/></g>
  <!-- talons over the book edge -->
  <g fill="#e39a3b"><path d="M206 338 q 6 -14 12 0 z M220 336 q 6 -14 12 0 z"/><path d="M280 336 q 6 -14 12 0 z M294 338 q 6 -14 12 0 z"/></g>
</svg>
