name: Weekly data update

on:
  schedule:
    - cron: "23 3 * * 1"   # Mondays 03:23 UTC (11:23 Beijing)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download upstream CSV (hackerbooks.org)
        run: python pipeline/fetch_upstream.py

      - name: Look up covers for new books
        run: python pipeline/covers.py

      - name: Fetch HN comments for new books
        run: python pipeline/comments.py

      - name: Refresh stats for the top 3000 books (older than 27 days)
        run: python pipeline/comments.py --top 3000 --refresh-days 27

      - name: Translate new books (Cloudflare Workers AI)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_AI_MODEL: ${{ vars.CF_AI_MODEL }}
        run: python pipeline/translate.py

      - name: Build site data
        run: python pipeline/build.py

      - name: Commit and push if changed
        run: |
          git config user.name "hackerbooks-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: weekly update $(date -u +%F)"
          git push
